<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cloud Uptime & API Monitor</title>
    <script src="https://tailwindcss.com"></script>
    <script src="https://jsdelivr.net"></script>
</head>
<body class="bg-gray-900 text-gray-100 min-h-screen p-6">
    <div class="max-w-5xl mx-auto">
        <!-- العنوان -->
        <header class="flex justify-between items-center mb-8 border-b border-gray-800 pb-4">
            <h1 class="text-2xl font-bold text-cyan-400">⚡ Cloud Uptime & API Monitor</h1>
            <span class="text-xs bg-cyan-900 text-cyan-300 px-3 py-1 rounded-full border border-cyan-700 animate-pulse">Live Active</span>
        </header>

        <!-- بطاقات الإحصائيات -->
        <div class="grid grid-cols-1 md:grid-cols-4 gap-4 mb-8">
            <div class="bg-gray-800 p-4 rounded-xl border border-gray-700 shadow">
                <p class="text-gray-400 text-sm">إجمالي المواقع</p>
                <p id="total-services" class="text-2xl font-bold text-white">0</p>
            </div>
            <div class="bg-gray-800 p-4 rounded-xl border border-gray-700 shadow">
                <p class="text-gray-400 text-sm">حالة النظام</p>
                <p id="system-status" class="text-2xl font-bold text-green-400">Stable</p>
            </div>
            <div class="bg-gray-800 p-4 rounded-xl border border-gray-700 shadow">
                <p class="text-gray-400 text-sm">متوسط السرعة</p>
                <p id="avg-latency" class="text-2xl font-bold text-cyan-400">0 ms</p>
            </div>
            <div class="bg-gray-800 p-4 rounded-xl border border-gray-700 shadow">
                <p class="text-gray-400 text-sm">وضع التحديث</p>
                <p class="text-2xl font-bold text-yellow-400">تلقائي (30ث)</p>
            </div>
        </div>

        <!-- قسم إضافة موقع جديد -->
        <div class="bg-gray-800 p-5 rounded-xl border border-gray-700 shadow mb-8">
            <h2 class="text-lg font-semibold mb-4 text-cyan-300">إضافة موقع جديد للمراقبة</h2>
            <form id="add-form" class="flex flex-col md:flex-row gap-3">
                <input type="text" id="name" placeholder="اسم الموقع (مثال: My API)" required class="bg-gray-900 border border-gray-700 rounded-lg px-4 py-2 flex-1 focus:outline-none focus:border-cyan-400">
                <input type="url" id="url" placeholder="الرابط (مثال: https://example.com)" required class="bg-gray-900 border border-gray-700 rounded-lg px-4 py-2 flex-1 focus:outline-none focus:border-cyan-400">
                <button type="submit" class="bg-cyan-600 hover:bg-cyan-500 text-white font-semibold px-6 py-2 rounded-lg transition">إضافة ومراقبة</button>
            </form>
        </div>

        <!-- جدول عرض الخدمات -->
        <div class="bg-gray-800 rounded-xl border border-gray-700 shadow overflow-x-auto mb-8">
            <table class="w-full text-right border-collapse">
                <thead>
                    <tr class="bg-gray-700 text-gray-300 text-sm">
                        <th class="p-4">اسم الخدمة</th>
                        <th class="p-4">الحالة</th>
                        <th class="p-4">السرعة (Latency)</th>
                        <th class="p-4">صلاحية SSL</th>
                        <th class="p-4">آخر فحص</th>
                        <th class="p-4 text-center">إجراء</th>
                    </tr>
                </thead>
                <tbody id="services-table" class="divide-y divide-gray-700">
                </tbody>
            </table>
        </div>

        <!-- الرسم البياني الحي -->
        <div class="bg-gray-800 p-5 rounded-xl border border-gray-700 shadow">
            <h2 class="text-lg font-semibold mb-4 text-cyan-300">📈 رسم بياني لسرعة الاستجابة (Latency History)</h2>
            <canvas id="latencyChart" height="100"></canvas>
        </div>
    </div>

    <script>
        let myChart;

        async function fetchServices() {
            try {
                const res = await fetch('/api/services');
                const data = await res.json();
                
                document.getElementById('total-services').innerText = data.length;
                
                if (data.length > 0) {
                    const totalLatency = data.reduce((sum, s) => sum + (s.latency || 0), 0);
                    const avg = Math.round(totalLatency / data.length);
                    document.getElementById('avg-latency').innerText = ${avg} ms;
                } else {
                    document.getElementById('avg-latency').innerText = '0 ms';
                }

                const tbody = document.getElementById('services-table');
                tbody.innerHTML = '';
                
                let chartLabels = [];

                data.forEach((service, index) => {
                    if (index === 0 && service.history && service.history.length > 0) {
                        chartLabels = service.history.map(h => h.time);
                    }

                    const row = document.createElement('tr');
                    row.className = "hover:bg-gray-750 transition";
                    const statusColor = service.status === 'Online' 
                        ? 'text-green-400 bg-green-900/30 border-green-800' 
                        : 'text-red-400 bg-red-900/30 border-red-800';
                    
                    row.innerHTML = `
                        <td class="p-4 font-medium"><a href="${service.url}" target="_blank" class="hover:underline text-cyan-400">${service.name}</a></td>
                        <td class="p-4"><span class="px-2.5 py-1 rounded-full text-xs border ${statusColor}">${service.status}</span></td>
                        <td class="p-4 font-mono">${service.latency} ms</td>
                        <td class="p-4 text-gray-300">${service.ssl_days} يوم باقي</td>
                        <td class="p-4 text-gray-400 text-sm">${service.last_checked}</td>
                        <td class="p-4 text-center">
                            <button onclick="deleteService(${service.id})" class="text-red-400 hover:text-red-300 text-xs bg-red-900/20 hover:bg-red-900/40 px-3 py-1 rounded border border-red-800/50 transition">حذف</button>
                        </td>
                    `;
                    tbody.appendChild(row);
                });

                const firstService = data.at(0);
                if (firstService && firstService.history && firstService.history.length > 0) {
                    const latencies = firstService.history.map(h => h.latency);
                    updateChart(chartLabels, latencies, firstService.name);
                }

            } catch (err) {
                console.error("Error fetching data", err);
            }
        }

        async function deleteService(id) {
            try {
                await fetch(/api/services/${id}, { method: 'DELETE' });
                fetchServices();
            } catch (err) {
                console.error("Error deleting service", err);
            }
        }

        function initChart() {
            const ctx = document.getElementById('latencyChart').getContext('2d');
            myChart = new Chart(ctx, {
                type: 'line',
                data: {
                    labels: [],
                    datasets: [{
                        label: 'سرعة الاستجابة (ms)',
                        data: [],
                        borderColor: '#22d3ee',
                        backgroundColor: 'rgba(34, 211, 238, 0.1)',
                        borderWidth: 2,
                        fill: true,
                        tension: 0.3
                    }]
                },
                options: {
                    responsive: true,
                    scales: {
                        y: { beginAtZero: true, grid: { color: '#374151' } },
                        x: { grid: { color: '#374151' } }
                    }
                }
            });
        }

        function updateChart(labels, data, labelName) {
            const dataset = myChart.data.datasets.at(0);
            if (dataset) {
                myChart.data.labels = labels;
                dataset.data = data;
                dataset.label = سرعة ${labelName} (ms);
                myChart.update();
            }
        }

        document.getElementById('add-form').addEventListener('submit', async (e) => {
            e.preventDefault();
            const name = document.getElementById('name').value;
            const url = document.getElementById('url').value;

            await fetch('/api/services', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ name, url })
            });

            document.getElementById('name').value = '';
            document.getElementById('url').value = '';
            fetchServices();
        });

        initChart();
        fetchServices();
        setInterval(fetchServices, 10000);
    </script>
</body>
</html>

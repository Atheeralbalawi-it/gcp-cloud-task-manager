<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <title>نظام إدارة المهام السحابي المحترف</title>
    <style>
        body { font-family: Tahoma, sans-serif; background: #f4f6f9; text-align: center; padding: 50px; }
        .container { background: white; padding: 30px; border-radius: 12px; box-shadow: 0 4px 15px rgba(0,0,0,0.1); display: inline-block; width: 450px; text-align: right; }
        h2 { text-align: center; color: #333; }
        ul { list-style: none; padding: 0; }
        li { background: #eef2f7; margin: 8px 0; padding: 12px; border-radius: 6px; display: flex; justify-content: space-between; align-items: center; }
        .input-group { display: flex; gap: 10px; margin-top: 20px; }
        input { flex: 1; padding: 10px; border: 1px solid #ccc; border-radius: 6px; }
        button { padding: 10px 20px; background: #007bff; color: white; border: none; cursor: pointer; border-radius: 6px; font-weight: bold; }
        button:hover { background: #0056b3; }
        .status { font-size: 12px; background: #ffc107; padding: 3px 8px; border-radius: 4px; color: #333; }
    </style>
</head>
<body>
    <div class="container">
        <h2>إدارة المهام السحابية (Cloud Tasks)</h2>
        <div class="input-group">
            <input type="text" id="taskInput" placeholder="أدخل مهمة جديدة...">
            <button onclick="addTask()">إضافة</button>
        </div>
        <ul id="taskList"></ul>
    </div>

    <script>
        // دمج الواجهة مع الـ API الخاص بـ FastAPI
        async function fetchTasks() {
            try {
                const res = await fetch('/api/tasks');
                const tasks = await res.json();
                const list = document.getElementById('taskList');
                list.innerHTML = '';
                tasks.forEach(t => {
                    list.innerHTML += <li><span><b>${t.title}</b></span> <span class="status">${t.status}</span></li>;
                });
            } catch (error) {
                console.error("خطأ في جلب المهام:", error);
            }
        }

        async function addTask() {
            const titleInput = document.getElementById('taskInput');
            const title = titleInput.value.trim();
            if(!title) return;

            await fetch('/api/tasks', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ title })
            });

            titleInput.value = '';
            fetchTasks();
        }

        // جلب المهام عند فتح الصفحة
        fetchTasks();
    </script>
</body>
</html>
